name: Portable Windows preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Run synthetic checks
        shell: pwsh
        run: dotnet run --project tests/Lantern.Checks/Lantern.Checks.csproj -c Release
      - name: Build portable package
        shell: pwsh
        run: ./scripts/Build-Portable.ps1
      - name: Build unsigned MSIX from the same payload
        shell: pwsh
        run: |
          $sdkVersion = '10.0.28000.2705'
          New-Item work/msix-sdk -ItemType Directory -Force | Out-Null
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.windows.sdk.buildtools/$sdkVersion/microsoft.windows.sdk.buildtools.$sdkVersion.nupkg" -OutFile work/msix-sdk/sdk.zip
          Expand-Archive work/msix-sdk/sdk.zip work/msix-sdk/tools
          $tool = Get-ChildItem work/msix-sdk/tools -Recurse -Filter makeappx.exe | Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (!$tool) { throw 'MSIX packager missing' }
          $portable = Get-ChildItem artifacts -Directory -Filter 'portable-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          ./scripts/Build-Msix.ps1 -PortableDirectory (Join-Path $portable.FullName '365Lantern') -MakeAppxPath $tool.FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 365Lantern-portable-preview
          path: |
            artifacts/portable-*/365Lantern-*-portable.zip
            artifacts/portable-*/365Lantern-*-portable.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 365Lantern-unsigned-msix-prototype
          path: |
            artifacts/msix-*/*.msix
            artifacts/msix-*/*.sha256
            artifacts/msix-*/package-provenance.json
          if-no-files-found: error
