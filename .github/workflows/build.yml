name: Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/Lantern.Desktop/Lantern.Desktop.csproj -c Release
      - run: dotnet run --project tests/Lantern.Checks/Lantern.Checks.csproj -c Release
      - shell: pwsh
        run: ./tests/DownloadedHelper.Checks.ps1 -PowerShellRuntime (Get-Command pwsh).Source
