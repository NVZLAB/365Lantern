name: Alpha bug report
description: Report a reproducible problem using synthetic or sanitized details.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not upload tenant exports, credentials, mailbox content or private screenshots. For a security vulnerability, use Security → Advisories → Report a vulnerability instead."
  - type: input
    id: version
    attributes:
      label: Version and distribution
      placeholder: 0.1.0-alpha.1 portable ZIP, Windows 11 x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected workflow
      options:
        - Launch or packaging
        - Authentication
        - Collection or offline import
        - Findings or timeline
        - Response (do not retry an unknown result)
        - Report or exports
        - Update check
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual behavior
      description: Use example.com accounts and synthetic data. Include a sanitized error category and whether the action result was Accepted, Denied, Not performed or Unknown.
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Relevant environment and collection limitations
      description: Optional licensing tier, role and missing coverage categories. Omit tenant IDs, account names, IPs and secrets.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have excluded credentials, real tenant evidence and private information from this report.
          required: true
